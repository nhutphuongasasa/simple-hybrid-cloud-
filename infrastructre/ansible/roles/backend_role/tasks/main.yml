- name: Debug deploy_path
  debug:
    msg: "deploy_path = {{ deploy_path }}"
    
- name: Tạo thư mục triển khai trên server
  file:
    path: "{{ deploy_path }}"
    state: directory
    mode: '0755'

- name: Render file Docker Compose từ Template J2
  template:
    src: docker-compose.yml.j2
    dest: "{{ deploy_path }}/docker-compose.yml"
    mode: '0644'